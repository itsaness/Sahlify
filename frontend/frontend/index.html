<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/sahlify.webp">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahlify — Algerian E-Commerce Store Builder</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('sahlify-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);

          var savedLang = localStorage.getItem('sahlify-lang');
          var lang = savedLang === 'ar' || savedLang === 'fr' || savedLang === 'en' ? savedLang : 'en';
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
